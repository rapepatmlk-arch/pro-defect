<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Defect Report – PRO-CON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f2f6b; --navy2:#2c4a9a; --gold:#b48a55; --green:#1e4d2b;
  --bg:#f3f4f8; --card:#fff; --line:#dfe3ec; --ink:#1b2133; --mute:#6b7387;
  --ok:#1f8a4c; --okbg:#e5f5ec; --wait:#c46a12; --waitbg:#fdf0e2; --red:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,"Thonburi",system-ui,sans-serif;font-size:17px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:17px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;box-shadow:0 2px 10px #0003}
.top .logos{display:flex;gap:8px;align-items:center}
.top .logos img{height:40px;background:#fff;border-radius:8px;padding:3px}
.top .logos img.round{border-radius:50%;padding:0;background:none}
.top h1{font-size:19px;margin:0;font-weight:700;line-height:1.2}
.top small{display:block;font-weight:400;opacity:.8;font-size:13px}
.top .sp{flex:1}
.tbtn{background:#ffffff22;color:#fff;border:1px solid #ffffff44;border-radius:10px;padding:8px 14px}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 120px}
.banner{background:#fff6d9;border:1px solid #f0d78a;color:#7a5a00;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:15px}
.banner svg{vertical-align:-3px;margin-right:4px}
.ad svg{vertical-align:-2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--line);box-shadow:0 2px 6px #0000000a;text-align:left}
.pcard h3{margin:0 0 6px;font-size:19px;color:var(--navy)}
.pcard p{margin:2px 0;color:var(--mute);font-size:14px}
.pcard .stat{display:flex;gap:8px;margin-top:10px}
.pnew{border:2px dashed #b8c0d6;background:transparent;color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center;min-height:130px;font-size:19px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.wait{background:var(--waitbg);color:var(--wait)} .chip.all{background:#e8ecf6;color:var(--navy)}
.phead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.phead .info{flex:1;min-width:260px;font-size:15px;line-height:1.55}
.phead .info b{display:inline-block;min-width:96px;color:var(--navy)}
.tabs{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;color:var(--mute)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.list{display:flex;flex-direction:column;gap:10px}
.grp{background:#e8ecf6;border-left:6px solid var(--navy);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy)}
.grp .n{min-width:34px}
.grp .t{flex:1}
.ibtn{display:inline-flex;align-items:center;gap:6px;border:none;background:#fff;border-radius:8px;padding:6px 12px;color:var(--navy);border:1px solid var(--line)}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:62px 1fr 190px 190px;gap:12px;padding:12px;align-items:start}
.item .no{font-weight:700;color:var(--navy);font-size:18px;text-align:center;padding-top:4px}
.item .tt{font-weight:700;font-size:17px}
.item .dd{color:var(--mute);font-size:15px;white-space:pre-wrap;margin-top:2px}
.item .ad{color:var(--ok);font-size:14px;white-space:pre-wrap;margin-top:6px}
.item .meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ph{border-radius:10px;background:#f1f3f8;min-height:150px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ph .lab{position:absolute;top:6px;left:6px;background:#000a;color:#fff;font-size:12px;padding:1px 8px;border-radius:999px;z-index:2}
.ph .imgs{display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:1}
.ph .imgs.one{grid-template-columns:1fr}
.ph img{width:100%;height:100%;object-fit:cover;display:block;min-height:74px;max-height:200px;background:#dde2ec}
.ph .imgs.one img{height:190px;max-height:none}
.ph.empty{align-items:center;justify-content:center;color:#9aa3b5;font-size:14px}
.shoot{width:100%;flex:1;min-height:150px;border:2px dashed #7fb798;background:#f0faf4;color:var(--ok);border-radius:10px;font-weight:700;font-size:16px}
@media (max-width:820px){.item{grid-template-columns:52px 1fr 1fr}.item .body{grid-column:2/4}.item .ph.b{grid-column:1/3}.item .ph.a{grid-column:3/4}}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fffffff2;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:13px 18px;font-weight:700;background:#e8ecf6;color:var(--navy)}
.btn.pri{background:var(--navy);color:#fff}
.btn.big{font-size:19px;padding:14px 26px}
.btn.gold{background:var(--gold);color:#fff}
.btn.okb{background:var(--ok);color:#fff}
.btn.del{background:#fdecea;color:var(--red)}
.btn:disabled{opacity:.5}
.empty-state{text-align:center;color:var(--mute);padding:50px 10px}
.empty-state .big{font-size:46px}
/* sheet */
.ov{position:fixed;inset:0;background:#0b1230aa;z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:#fff;width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet h2{margin:0 0 12px;color:var(--navy);font-size:21px;display:flex;align-items:center;gap:10px}
.fld{margin-bottom:14px}
.fld label{display:block;font-weight:600;color:var(--navy);margin-bottom:5px;font-size:15px}
.mic-row{display:flex;gap:8px;align-items:stretch}
.mic-row input,.mic-row textarea,.fld input,.fld select,.fld textarea{flex:1;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fbfcfe}
textarea{min-height:84px;resize:vertical}
.mic{flex:none;width:50px;height:50px;align-self:flex-start;border:none;border-radius:50%;background:linear-gradient(145deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #1f2f6b40;transition:transform .15s,box-shadow .15s;position:relative}
.mic svg{width:24px;height:24px;flex:none}
.mic:active{transform:scale(.92)}
.mic.on{background:linear-gradient(145deg,#e5533d,#c0392b);box-shadow:0 0 0 0 #c0392b80;animation:ring 1.3s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 #c0392b80}70%{box-shadow:0 0 0 12px #c0392b00}100%{box-shadow:0 0 0 0 #c0392b00}}
.partial{color:var(--mute);font-style:italic;font-size:14px;min-height:0}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .p{position:relative;width:118px;height:118px;border-radius:10px;overflow:hidden;background:#e7eaf2}
.photos .p img{width:100%;height:100%;object-fit:cover}
.photos .p .x{position:absolute;top:4px;right:4px;background:#000b;color:#fff;border:none;border-radius:999px;width:28px;height:28px;font-size:15px;line-height:28px;padding:0}
.photos .p.up::after{content:"กำลังอัปโหลด…";position:absolute;inset:0;background:#fff9;display:flex;align-items:center;justify-content:center;font-size:12px}
.addp{width:118px;height:118px;border-radius:10px;border:2px dashed #b8c0d6;background:#fafbfe;color:var(--navy);font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.addp-ic{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:4px;box-shadow:0 3px 8px #1f2f6b33}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center}
.shoot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.shoot-ic{width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,#2fa565,var(--ok));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px #1f8a4c40}
.empty-state .big{color:#9aa7c7}
.ico{flex:none}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.sec.after{background:#f4fbf7;border:1px solid #cfe9da;border-radius:14px;padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.acts .sp{flex:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1b2133;color:#fff;padding:11px 18px;border-radius:12px;z-index:90;font-size:15px;max-width:90vw;text-align:center;box-shadow:0 6px 24px #0005}
.viewer{position:fixed;inset:0;background:#000e;z-index:80;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:96vw;max-height:88vh}
.viewer button{position:absolute;top:16px;right:16px}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.pages img{width:100%;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 8px #0002}
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt label{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:6px;align-items:center;font-weight:400;color:var(--ink);margin:0}
.opt input{width:auto;flex:none}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle}
.hint{font-size:13px;color:var(--mute);margin-top:4px}
.prog{height:8px;background:#e8ecf6;border-radius:999px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--navy);width:0;transition:width .2s}
</style>
</head>
<body>
<div class="top">
  <div class="logos"><img src="logo.jpg" alt="PRO-CON"></div>
  <div><h1 id="topTitle">บันทึกงานแก้ไข (Defect)</h1><small id="topSub">PRO CONSTRUCTION & DESIGN</small></div>
  <div class="sp"></div>
  <button class="tbtn" id="backBtn" style="display:none">‹ โครงการทั้งหมด</button>
</div>
<div class="wrap" id="main"><div class="empty-state">กำลังเปิดแอป…</div></div>
<div class="bar" id="bar" style="display:none">
  <button class="btn pri big" id="shootBefore"><svg class="ico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.8l1.4-2h6.6l1.4 2h1.8A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg> ถ่ายรูปก่อนแก้ไข</button>
  <button class="btn" id="libBefore"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m21 15-4.5-4.5L7 20"/></svg> เลือกจากคลังรูป</button>
  <button class="btn" id="addGroup">＋ หมวดงาน</button>
  <button class="btn gold" id="pdfBtn"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg> ออก PDF</button>
</div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="libIn" accept="image/*" multiple hidden>
<div id="layer"></div>

<script>
"use strict";
const APP_VER="1.7";
const svgI=(d,s=18)=>`<svg class="ico" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICO={
  gear:svgI('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  pen:svgI('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  down:svgI('<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 19h14"/>'),
  up:svgI('<path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 19h14"/>'),
  phone:svgI('<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/>'),
  info:svgI('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>'),
  chevUp:svgI('<path d="m6 15 6-6 6 6"/>',20),
  chevDn:svgI('<path d="m6 9 6 6 6-6"/>',20),
  check:svgI('<path d="M20 6 9 17l-5-5"/>',15),
  trash:svgI('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>'),
};
const LOGO_PROCON="logo.jpg", LOGO_WSK="logo-wsk.png";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const thDate=iso=>{if(!iso)return"";const [y,m,d]=iso.split("-").map(Number);return d+"/"+m+"/"+(y+543)};
const clone=o=>JSON.parse(JSON.stringify(o));

let toastT;
function toast(msg,ms=2600){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}t.textContent=msg;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",ms)}

/* ---------------- storage: cloud (db + assets) ---------------- */
const Cloud={
  kind:"cloud",
  init(db,assets){this.db=db;this.assets=assets},
  listenProjects(cb){return this.db.collection("projects").onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...clone(d.data())})),s.metadata.fromCache),e=>{cb(null);toast("โหลดข้อมูลไม่ได้ ("+e.code+")")})},
  listenItems(pid,cb){return this.db.collection("projects/"+pid+"/items").onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...clone(d.data())}))),e=>toast("โหลดรายการไม่ได้ ("+e.code+")"))},
  async saveProject(p){const {id,...r}=p;await this.db.doc("projects/"+id).set(r)},
  async deleteProject(id,items){for(const it of items)await this.db.doc("projects/"+id+"/items/"+it.id).delete();await this.db.doc("projects/"+id).delete()},
  async saveItem(pid,it){const {id,...r}=it;await this.db.doc("projects/"+pid+"/items/"+id).set(r)},
  async deleteItem(pid,id){await this.db.doc("projects/"+pid+"/items/"+id).delete()},
  async upload(blob){const r=await this.assets.upload(blob);return r.id},
  async src(id){return "/_blob/"+id}
};
/* ---------------- storage: this device (IndexedDB) ---------------- */
const Local={
  kind:"local",pl:new Set(),il:new Map(),urls:new Map(),mem:{projects:new Map(),items:new Map(),photos:new Map()},
  async init(){try{this.idb=await new Promise((res,rej)=>{const r=indexedDB.open("defect-app",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("projects",{keyPath:"id"});d.createObjectStore("items",{keyPath:"id"}).createIndex("pid","pid");d.createObjectStore("photos")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.idb=null}},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.idb.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})},
  async all(store){if(!this.idb)return[...this.mem[store].values()];return await this.tx(store,"readonly",s=>s.getAll())||[]},
  async put(store,v,k){if(!this.idb){this.mem[store].set(k??v.id,v);return}await this.tx(store,"readwrite",s=>k!==undefined?s.put(v,k):s.put(v))},
  async del(store,k){if(!this.idb){this.mem[store].delete(k);return}await this.tx(store,"readwrite",s=>s.delete(k))},
  async emitP(){const a=await this.all("projects");this.pl.forEach(f=>f(a))},
  async emitI(pid){const fs=this.il.get(pid);if(!fs)return;const a=(await this.all("items")).filter(i=>i.pid===pid);fs.forEach(f=>f(a))},
  listenProjects(cb){this.pl.add(cb);this.emitP();return()=>this.pl.delete(cb)},
  listenItems(pid,cb){if(!this.il.has(pid))this.il.set(pid,new Set());this.il.get(pid).add(cb);this.emitI(pid);return()=>this.il.get(pid).delete(cb)},
  async saveProject(p){await this.put("projects",clone(p));this.emitP()},
  async deleteProject(id,items){for(const it of items)await this.del("items",it.id);await this.del("projects",id);this.emitP()},
  async saveItem(pid,it){await this.put("items",{...clone(it),pid});this.emitI(pid)},
  async deleteItem(pid,id){await this.del("items",id);this.emitI(pid)},
  async upload(blob){const id="ph_"+uid();await this.put("photos",blob,id);return id},
  async src(id){if(this.urls.has(id))return this.urls.get(id);let b;if(!this.idb)b=this.mem.photos.get(id);else b=await this.tx("photos","readonly",s=>s.get(id));if(!b)return"";const u=URL.createObjectURL(b);this.urls.set(id,u);return u}
};

let store=null, dict=null, downloads=null, STANDALONE=false;
async function saveFile(blob,filename){
  if(downloads){try{await downloads.save({filename,data:blob});return true}catch(e){if(e&&e.code==="declined")return false;toast("บันทึกไม่สำเร็จ ("+(e.code||e)+")");return false}}
  try{const f=new File([blob],filename,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return true}}catch(e){if(e&&e.name==="AbortError")return false}
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return true;
}
const S={projects:[],items:[],pid:null,filter:"all",unsubItems:null,loaded:false};
const localSrc=new Map(); // temp previews while uploading

/* ---------------- numbering ---------------- */
function sorted(){return [...S.items].sort((a,b)=>(a.order-b.order)||(a.createdAt||0)-(b.createdAt||0))}
function numbered(){
  const out=[];let g=0,k=0,flat=0;
  for(const it of sorted()){
    if(it.kind==="group"){g++;k=0;out.push({...it,no:String(g)})}
    else if(g===0){flat++;out.push({...it,no:String(flat)})}
    else{k++;out.push({...it,no:g+"."+k})}
  }
  return out;
}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function compress(file){
  const u=URL.createObjectURL(file);
  try{const img=await loadImg(u);const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
  }finally{URL.revokeObjectURL(u)}
}
async function uploadFiles(files,onEach){
  const ids=[];
  for(const f of files){
    try{const blob=await compress(f);const tmp=URL.createObjectURL(blob);
      const id=await store.upload(blob);localSrc.set(id,tmp);ids.push(id);onEach&&onEach(id);
    }catch(e){toast("อัปโหลดรูปไม่สำเร็จ "+(e&&e.code?"("+e.code+")":""))}
  }
  return ids;
}

let dictTarget=null, dictBtn=null, dictOn=false;
function setupDict(){
  if(!dict)return;
  dict.onFinal(({text})=>{if(!dictTarget||!text)return;const v=dictTarget.value;dictTarget.value=(v&&!/\s$/.test(v)?v+" ":v)+text;dictTarget.dispatchEvent(new Event("input"));const p=dictTarget.closest(".fld")?.querySelector(".partial");if(p)p.textContent=""});
  dict.onPartial(({text})=>{const p=dictTarget?.closest(".fld")?.querySelector(".partial");if(p)p.textContent=text?"🎙 "+text:""});
  dict.onState(({state})=>{dictOn=state==="listening";document.querySelectorAll(".mic").forEach(b=>b.classList.toggle("on",dictOn&&b===dictBtn));if(!dictOn){document.querySelectorAll(".partial").forEach(p=>p.textContent="")}});
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let srObj=null;
function srClick(btn,input){
  if(srObj){try{srObj.stop()}catch(e){}if(dictBtn===btn)return}
  const r=new SR();r.lang="th-TH";r.interimResults=true;r.continuous=false;srObj=r;dictBtn=btn;dictTarget=input;
  const part=input.closest(".fld")?.querySelector(".partial");btn.classList.add("on");
  r.onresult=e=>{let fin="",tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else tmp+=t}
    if(part)part.textContent=tmp?"🎙 "+tmp:"";if(fin){const v=input.value;input.value=(v&&!/\s$/.test(v)?v+" ":v)+fin.trim()}};
  r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){toast("ใช้ไมค์ในหน้านี้ไม่ได้ — แตะช่องแล้วกดไมค์บนแป้นพิมพ์ iPad แทน",3500)}};
  r.onend=()=>{btn.classList.remove("on");if(part)part.textContent="";if(srObj===r)srObj=null};
  try{r.start()}catch(e){btn.classList.remove("on");srObj=null;input.focus()}
}
function micClick(btn){
  const input=btn.parentElement.querySelector("input,textarea");
  if(!dict&&SR&&STANDALONE){srClick(btn,input);return}
  if(dict){
    if(dictOn&&dictBtn===btn){dict.stop().catch(()=>{});return}
    if(dictOn){dict.stop().catch(()=>{})}
    dictTarget=input;dictBtn=btn;
    dict.start().catch(e=>{if(e&&e.code==="not_granted"){dict=null;toast("ไม่ได้รับอนุญาตใช้ไมค์ — ใช้ปุ่ม 🎤 บนแป้นพิมพ์แทนได้")}});
  }else{input.focus();toast("แตะปุ่ม 🎤 บนแป้นพิมพ์ iPad แล้วพูดได้เลย",3200)}
}

async function move(id,dir){
  const rows=sorted();const i=rows.findIndex(r=>r.id===id);const j=i+dir;if(j<0||j>=rows.length)return;
  const a=clone(rows[i]),b=clone(rows[j]);const t=a.order;a.order=b.order;b.order=t;if(a.order===b.order){a.order+=dir*0.001}
  await saveItem(a);await saveItem(b);toast(dir<0?"เลื่อนขึ้นแล้ว":"เลื่อนลงแล้ว",1200);
}
function groupOf(it){let g=null;for(const r of sorted()){if(r.id===it.id)break;if(r.kind==="group")g=r}return g}
function orderInGroup(gid,selfId){
  const rows=sorted().filter(r=>r.id!==selfId);let start=gid?rows.findIndex(r=>r.id===gid):-1;
  let k=start+1;while(k<rows.length&&rows[k].kind!=="group")k++;
  const prev=k-1>=0?rows[k-1].order:0;const next=k<rows.length?rows[k].order:prev+2;return (prev+next)/2;
}

const PX=7.874; // px per mm (200 dpi)
const PW=210, PH=297, M=10;
const COLS=[13,46,48,48,35]; // ลำดับ, รายการ, ก่อน, หลัง, หมายเหตุ  = 190
const COLX=COLS.reduce((a,w,i)=>(a.push(a[i]+w),a),[M]);
const seg=(window.Intl&&Intl.Segmenter)?new Intl.Segmenter("th",{granularity:"word"}):null;
function font(ctx,size,w=400){ctx.font=`${w} ${size*PX}px Sarabun, Thonburi, sans-serif`}
function wrap(ctx,text,maxW){
  const lines=[];maxW*=PX;
  for(const para of String(text||"").split("\n")){
    const toks=seg?[...seg.segment(para)].map(s=>s.segment):[...para];let line="";
    for(let t of toks){
      if(ctx.measureText(line+t).width<=maxW){line+=t;continue}
      if(line.trim()){lines.push(line.trimEnd());line=""}
      t=t.trimStart();
      if(ctx.measureText(t).width>maxW){for(const ch of t){if(ctx.measureText(line+ch).width>maxW&&line){lines.push(line);line=""}line+=ch}}else line=t;
    }
    lines.push(line);
  }
  return lines;
}
// align by measuring ourselves: iPad Safari ignored ctx.textAlign (centered/right text ran off the page)
function txt(ctx,s,x,y,size,w=400,color="#1b2133",align="left"){font(ctx,size,w);ctx.fillStyle=color;ctx.textAlign="left";ctx.textBaseline="top";let px=x*PX;if(align!=="left"){const tw=ctx.measureText(s).width;px-=align==="center"?tw/2:tw}ctx.fillText(s,px,y*PX)}
function rect(ctx,x,y,w,h,fill,stroke,lw=0.25){ctx.beginPath();ctx.rect(x*PX,y*PX,w*PX,h*PX);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw*PX;ctx.stroke()}}
function drawLogo(ctx,img,x,y,h){if(!img)return 0;const w=h*img.naturalWidth/img.naturalHeight;ctx.drawImage(img,x*PX,y*PX,w*PX,h*PX);return w}
const logoW=(img,h)=>img?h*img.naturalWidth/img.naturalHeight:0;

const FS=3.35, LH=1.5; // body font (mm) & line height
function itemLayout(ctx,r){
  const w2=COLS[1]-3, w5=COLS[4]-3;
  font(ctx,FS+0.15,700);const t=wrap(ctx,r.title||"-",w2);
  font(ctx,FS-0.2,400);const d=r.detail?wrap(ctx,r.detail,w2):[];
  const done=isDone(r);
  const st=done?(r.doneDate?"แล้วเสร็จ "+thDate(r.doneDate):"แก้ไขแล้วเสร็จ"):"รอดำเนินการแก้ไข";
  font(ctx,FS-0.3,600);const s=wrap(ctx,st,w5-2);
  font(ctx,FS-0.2,400);const a=r.afterDetail?wrap(ctx,r.afterDetail,w5):[];const rm=r.remark?wrap(ctx,r.remark,w5):[];
  const h2=3+t.length*(FS+0.15)*LH+(d.length?1+d.length*(FS-0.2)*LH:0)+2;
  const h5=3+s.length*(FS-0.3)*LH+2+(a.length?a.length*(FS-0.2)*LH+1:0)+(rm.length?rm.length*(FS-0.2)*LH+1:0)+2;
  const hasPh=(r.before&&r.before.length)||(r.after&&r.after.length);
  const h=Math.max(hasPh?60:16,h2,h5);
  return {t,d,s,a,rm,done,h};
}
async function drawPhotos(ctx,ids,x,y,w,h){
  const pad=1.6;x+=pad;y+=pad;w-=2*pad;h-=2*pad;
  if(!ids||!ids.length){rect(ctx,x,y,w,h,"#f6f7fa");txt(ctx,"—",x+w/2,y+h/2-2,4,400,"#b0b6c3","center");return}
  const n=Math.min(ids.length,4);const cols=n===1?1:2, rows=n<=2?1:2;
  const cw=(w-(cols-1)*1)/cols, ch=(h-(rows-1)*1)/rows;
  for(let i=0;i<n;i++){
    const cx=x+(i%cols)*(cw+1), cy=y+Math.floor(i/cols)*(ch+1);
    rect(ctx,cx,cy,cw,ch,"#eef0f4");
    try{const img=await loadImg(localSrc.get(ids[i])||await store.src(ids[i]));
      const s=Math.min(cw/img.naturalWidth,ch/img.naturalHeight);const iw=img.naturalWidth*s,ih=img.naturalHeight*s;
      ctx.drawImage(img,(cx+(cw-iw)/2)*PX,(cy+(ch-ih)/2)*PX,iw*PX,ih*PX);img.src="";
    }catch(e){txt(ctx,"(โหลดรูปไม่ได้)",cx+cw/2,cy+ch/2-2,2.8,400,"#999","center")}
  }
  if(ids.length>4)txt(ctx,"+"+(ids.length-4)+" รูป",x+w-1,y+h-5,2.8,700,"#c0392b","right");
}
async function buildPdf(p,o,prog){
  try{await Promise.all([document.fonts.load(`400 30px Sarabun`),document.fonts.load(`700 30px Sarabun`),document.fonts.load(`600 30px Sarabun`)])}catch(e){}
  const [lp,lw]=await Promise.all([loadImg(LOGO_PROCON).catch(()=>null),loadImg(LOGO_WSK).catch(()=>null)]);
  const cv=document.createElement("canvas");cv.width=Math.round(PW*PX);cv.height=Math.round(PH*PX);const ctx=cv.getContext("2d");
  const th=o.theme;
  // select rows
  const all=numbered();let rows=[];let pendingGroup=null;
  for(const r of all){
    if(r.kind==="group"){pendingGroup=r;continue}
    const d=isDone(r);if(o.filter==="done"&&!d||o.filter==="wait"&&d)continue;
    if(pendingGroup){rows.push(pendingGroup);pendingGroup=null}
    rows.push(r);
  }
  // layout
  const FIRST_TOP=M+50, NEXT_TOP=M+20, HEAD_H=8, BOTTOM=PH-14, GROUP_H=8;
  const pages=[];let cur=null,y=0;
  const newPage=()=>{cur={rows:[]};pages.push(cur);y=(pages.length===1?FIRST_TOP:NEXT_TOP)+HEAD_H};
  newPage();
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    if(r.kind==="group"){
      const nh=rows[i+1]?itemLayout(ctx,rows[i+1]).h:0;
      if(y+GROUP_H+nh>BOTTOM&&cur.rows.length)newPage();
      cur.rows.push({r,y,h:GROUP_H});y+=GROUP_H;continue;
    }
    const L=itemLayout(ctx,r);L.h=Math.min(L.h,BOTTOM-NEXT_TOP-HEAD_H);
    if(y+L.h>BOTTOM&&cur.rows.length)newPage();
    cur.rows.push({r,y,h:L.h,L});y+=L.h;
  }
  const items=rows.filter(r=>r.kind!=="group");
  const SUM_H=o.sum?9:0, SIG_H=o.sig?36:0;
  if(SUM_H+SIG_H){if(y+4+SUM_H+SIG_H>BOTTOM){newPage();cur.tail=NEXT_TOP;cur.noHead=true}else cur.tail=y+4}
  const total=pages.length;const jpgs=[],previews=[];
  for(let pi=0;pi<total;pi++){
    prog(`กำลังวาดหน้า ${pi+1}/${total}…`,pi/total);
    const pg=pages[pi];ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
    // header
    if(pi===0){
      drawLogo(ctx,lp,M,M,20);drawLogo(ctx,lw,PW-M-logoW(lw,21),M-0.5,21);
      txt(ctx,o.title||"งานแก้ไขความเรียบร้อย (Defection)",PW/2,M+4,6,700,th.h,"center");
      if(o.rev)txt(ctx,o.rev,PW/2,M+13,3.6,600,th.acc,"center");
      rect(ctx,M,M+23,PW-2*M,0.6,th.acc);
      const info=[["Project",p.project],["Owner",p.owner],["Consultant",p.consultant],["Construction",p.contractor]];
      info.forEach(([k,v],i)=>{txt(ctx,k,M+1,M+26+i*5.4,3.6,700,th.h);txt(ctx,": "+(v||"-"),M+27,M+26+i*5.4,3.6,400)});
      txt(ctx,"วันที่ "+thDate(o.date),PW-M-1,M+26,3.6,600,"#1b2133","right");
    }else{
      drawLogo(ctx,lp,M,M,12);drawLogo(ctx,lw,PW-M-logoW(lw,12.5),M-0.3,12.5);
      txt(ctx,o.title||"งานแก้ไขความเรียบร้อย",PW/2,M+1,4.4,700,th.h,"center");
      txt(ctx,(p.project||"")+(o.rev?"  •  "+o.rev:""),PW/2,M+7,3.1,400,"#555","center");
    }
    // table head
    const ty=(pi===0?FIRST_TOP:NEXT_TOP);
    if(!pg.noHead){rect(ctx,M,ty,PW-2*M,HEAD_H,th.h);
    ["ลำดับ","รายการ","ก่อนการแก้ไข","แก้ไขแล้วเสร็จ","หมายเหตุ"].forEach((h,i)=>txt(ctx,h,COLX[i]+COLS[i]/2,ty+1.9,3.6,700,"#fff","center"));}
    // rows
    for(const {r,y,h,L} of pg.rows){
      if(r.kind==="group"){
        rect(ctx,M,y,PW-2*M,h,th.soft,"#9aa3b5");rect(ctx,M,y,1.2,h,th.h);
        txt(ctx,r.no,COLX[0]+COLS[0]/2,y+1.8,3.7,700,th.h,"center");
        font(ctx,3.7,700);const t=wrap(ctx,r.title||"",PW-2*M-COLS[0]-4)[0];txt(ctx,t,COLX[1]+1.5,y+1.8,3.7,700,th.h);continue;
      }
      prog(`กำลังวาดหน้า ${pi+1}/${total} — รายการ ${r.no}`,(pi+0.5)/total);
      for(let c=0;c<5;c++)rect(ctx,COLX[c],y,COLS[c],h,null,"#9aa3b5");
      txt(ctx,r.no,COLX[0]+COLS[0]/2,y+2.2,FS+0.1,700,"#1b2133","center");
      let yy=y+2;L.t.forEach(l=>{txt(ctx,l,COLX[1]+1.5,yy,FS+0.15,700);yy+=(FS+0.15)*LH});
      if(L.d.length){yy+=1;L.d.forEach(l=>{txt(ctx,l,COLX[1]+1.5,yy,FS-0.2,400,"#4a5163");yy+=(FS-0.2)*LH})}
      await drawPhotos(ctx,r.before,COLX[2],y,COLS[2],h);
      await drawPhotos(ctx,r.after,COLX[3],y,COLS[3],h);
      yy=y+2;const bx=COLX[4]+1.5;
      font(ctx,FS-0.3,600);const sw=Math.max(...L.s.map(l=>ctx.measureText(l).width))/PX+2.4;
      rect(ctx,bx-0.6,yy-0.4,sw,L.s.length*(FS-0.3)*LH+0.6,L.done?"#e5f5ec":"#fdf0e2");
      L.s.forEach(l=>{txt(ctx,l,bx+0.6,yy,FS-0.3,600,L.done?"#1f8a4c":"#c46a12");yy+=(FS-0.3)*LH});yy+=1.8;
      L.a.forEach(l=>{txt(ctx,l,bx,yy,FS-0.2,400);yy+=(FS-0.2)*LH});if(L.a.length)yy+=1;
      L.rm.forEach(l=>{txt(ctx,l,bx,yy,FS-0.2,600,"#7a5a00");yy+=(FS-0.2)*LH});
    }
    // tail
    if(pg.tail!==undefined){
      let ty2=pg.tail;
      if(o.sum){const nd=items.filter(isDone).length;txt(ctx,`สรุป: ทั้งหมด ${items.length} รายการ   •   แก้ไขแล้วเสร็จ ${nd} รายการ   •   รอดำเนินการ ${items.length-nd} รายการ`,M+1,ty2+1,3.5,600,th.h);ty2+=SUM_H}
      if(o.sig){const bw=(PW-2*M-8)/3;[["ผู้รับจ้าง",p.contractor],["ที่ปรึกษาโครงการ",p.consultant],["เจ้าของโครงการ",p.owner]].forEach(([role,org],i)=>{
        const bx=M+i*(bw+4);rect(ctx,bx,ty2,bw,32,null,"#9aa3b5");
        txt(ctx,role,bx+bw/2,ty2+2,3.4,700,th.h,"center");
        txt(ctx,"ลงชื่อ .......................................",bx+bw/2,ty2+13,3.2,400,"#333","center");
        txt(ctx,"(.......................................)",bx+bw/2,ty2+19,3.2,400,"#333","center");
        font(ctx,2.8,400);txt(ctx,wrap(ctx,org||"",bw-4)[0]||"",bx+bw/2,ty2+23.6,2.8,400,"#666","center");
        txt(ctx,"วันที่ ......../......../........",bx+bw/2,ty2+27.6,2.9,400,"#333","center");})}
    }
    // footer
    rect(ctx,M,PH-10.5,PW-2*M,0.3,th.acc);
    txt(ctx,"PRO CONSTRUCTION & DESIGN CO.,LTD.  •  "+(p.name||"")+"  •  v"+APP_VER,M,PH-9,2.8,400,"#777");
    txt(ctx,`หน้า ${pi+1} / ${total}`,PW-M,PH-9,2.9,600,"#555","right");
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.86));
    jpgs.push(new Uint8Array(await blob.arrayBuffer()));previews.push(URL.createObjectURL(blob));
  }
  prog("กำลังรวมไฟล์ PDF…",1);
  return {pages:previews,blob:new Blob([makePdf(jpgs,cv.width,cv.height,o.title)],{type:"application/pdf"})};
}
function makePdf(jpgs,w,h,title){
  const enc=new TextEncoder();const parts=[];let len=0;const off=[];
  const put=d=>{if(typeof d==="string")d=enc.encode(d);parts.push(d);len+=d.length};
  const obj=(n,f)=>{off[n]=len;put(n+" 0 obj\n");f();put("\nendobj\n")};
  put("%PDF-1.4\n%ÿÿ\n");
  const n=jpgs.length;
  obj(1,()=>put("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>put(`<< /Type /Pages /Kids [${jpgs.map((_,i)=>(3+3*i)+" 0 R").join(" ")}] /Count ${n} >>`));
  jpgs.forEach((j,i)=>{const p=3+3*i;
    obj(p,()=>put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    const cs=`q 595.28 0 0 841.89 0 0 cm /Im${i} Do Q`;
    obj(p+1,()=>put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p+2,()=>{put(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`);put(j);put("\nendstream")});
  });
  const info=3+3*n;obj(info,()=>put("<< /Producer (PRO-CON Defect App) /Creator (PRO-CON Defect App) >>"));
  const size=info+1;const xref=len;
  let x=`xref\n0 ${size}\n0000000000 65535 f \n`;for(let k=1;k<size;k++)x+=String(off[k]).padStart(10,"0")+" 00000 n \n";
  put(x);put(`trailer\n<< /Size ${size} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out=new Uint8Array(len);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out;
}

/* ---------------- boot ---------------- */
(async function boot(){
  let db=null,assets=null;
  STANDALONE=!(window.claude&&typeof claude.use==="function");
  if(!STANDALONE){
    const safe=n=>claude.use(n).catch(()=>null);
    [db,assets,dict,downloads]=await Promise.all([safe("db"),safe("assets"),safe("dictation"),safe("downloads")]);
  }
  if(db&&assets){store=Cloud;Cloud.init(db,assets)}else{store=Local;await Local.init();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
  setupDict();
  const slow=setTimeout(()=>{const s=$("#slow");if(s)s.style.display=""},10000);
  store.listenProjects((list,fromCache)=>{if(list===null){S.loaded=true;clearTimeout(slow);render();return}S.projects=list;if(!fromCache){S.loaded=true;clearTimeout(slow)}render()});
  render();
})();
